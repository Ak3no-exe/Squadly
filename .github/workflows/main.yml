name: Build APK

on:
  push:
    tags: ['v*']        # ex. git tag v1.0.1 && git push --tags
  workflow_dispatch:     # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Numéro de version et dépôt dans l'appli
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || V="0.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          sed -i "s/APP_VERSION='[^']*'/APP_VERSION='$V'/; s|GH_REPO=''|GH_REPO='${GITHUB_REPOSITORY}'|" app/src/main/assets/index.html

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - run: cp app/build/outputs/apk/release/app-release.apk GameTrack.apk

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GameTrack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameTrack-apk
          path: GameTrack.apk
          
