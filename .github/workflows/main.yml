            cat >> android/app/build.gradle <<'GRADLE'

            android {
                signingConfigs {
                    debug {
                        storeFile file('debug.keystore')
                        storePassword 'android'
                        keyAlias 'androiddebugkey'
                        keyPassword 'android'
                    }
                }
                buildTypes {
                    debug {
                        signingConfig signingConfigs.debug
                    }
                }
            }
          GRADLE
          fi

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GameTrack-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK (pour la mise à jour depuis l'appli)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GameTrack.apk
          gh release create "build-${{ github.run_number }}" GameTrack.apk --title "GameTrack build ${{ github.run_number }}" --notes "Version automatique" --latest
          
