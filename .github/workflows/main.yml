name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # IMPORTANT : doit être le même identifiant que ton appli déjà installée
  APP_ID: com.gametrack.app
  APP_NAME: GameTrack

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les fichiers web
        run: |
          mkdir -p www
          echo '{"build": ${{ github.run_number }}}' > www/version.json
          cp index.html www/
          for f in sw.js manifest.json manifest.webmanifest icon.png favicon.ico; do
            [ -f "$f" ] && cp "$f" www/ || true
          done

      - name: Créer le projet Android (Capacitor)
        run: |
          [ -f package.json ] || npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www"
          }
          EOF
          if [ ! -f android/gradlew ]; then
            # garder tes icônes (et la couleur de fond) avant de recréer le projet
            [ -d android/app/src/main/res ] && cp -r android/app/src/main/res /tmp/res_backup || true
            rm -rf android
            npx cap add android
            if [ -d /tmp/res_backup ] && [ -n "$(cd /tmp/res_backup && find . -name 'ic_launcher*' -type f)" ]; then
              rm -f android/app/src/main/res/mipmap-*/ic_launcher*
              (cd /tmp/res_backup && find . -name 'ic_launcher*' -type f) | while read -r f; do
                mkdir -p "android/app/src/main/res/$(dirname "$f")"
                cp "/tmp/res_backup/$f" "android/app/src/main/res/$f"
              done
            fi
          fi
          if ls assets/icon*.png >/dev/null 2>&1; then
            npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' || true
          fi
          npx cap sync android

