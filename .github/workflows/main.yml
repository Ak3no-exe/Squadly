name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer le dossier web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Configurer Capacitor si besoin
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init GameTrack com.gametrack.app --web-dir=www
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Générer le logo depuis le dossier assets
        run: |
          if [ -d assets ]; then
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android
          else
            echo "Pas de dossier assets : le logo par défaut sera utilisé"
          fi

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTrack-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
